apiVersion: apps/v1
kind: Deployment
metadata:
  name: smrp-gofiber
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smrp-gofiber
  template:
    metadata:
      labels:
        app: smrp-gofiber
    spec:
      containers:
      - name: smrp-gofiber
        image: docker.io/wfsiew888/smrp-gofiber:1.0.0
        ports:
        - containerPort: 8100
        readinessProbe:
          httpGet:
            path: /smrp/healthz
            port: 8100
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /smrp/ealthz
            port: 8100
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: smrp-gofiber
spec:
  type: NodePort
  selector:
    app: smrp-gofiber
  ports:
    - protocol: TCP
      port: 8100
      targetPort: 8100
      nodePort: 30082

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gofiber-smrp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gofiber-smrp
  template:
    metadata:
      labels:
        app: gofiber-smrp
    spec:
      containers:
      - name: gofiber-smrp
        image: gofiber-smrp:1.0
        ports:
        - containerPort: 8100
        readinessProbe:
          httpGet:
            path: /smrp/healthz
            port: 8100
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /smrp/ealthz
            port: 8100
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gofiber-smrp-service
spec:
  type: NodePort
  selector:
    app: gofiber-smrp
  ports:
    - protocol: TCP
      port: 8100
      targetPort: 8100
      nodePort: 30001
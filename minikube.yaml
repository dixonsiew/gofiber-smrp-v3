---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smrp-gofiber-db-config
data:
  DB_HOST: "postgres-service"
  MONGODB_HOST: "mongodb-service"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smrp-gofiber
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smrp-gofiber
  template:
    metadata:
      labels:
        app: smrp-gofiber
    spec:
      containers:
      - name: smrp-gofiber
        image: smrp-gofiber:1.0.0
        ports:
        - containerPort: 8100
        envFrom:
          - configMapRef:
              name: smrp-gofiber-db-config
              optional: true
        env:
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: smrp-gofiber-db-config
                key: DB_HOST
                optional: true
          - name: MONGODB_HOST
            valueFrom:
              configMapKeyRef:
                name: smrp-gofiber-db-config
                key: MONGODB_HOST
                optional: true
        readinessProbe:
          httpGet:
            path: /smrp/healthz
            port: 8100
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /smrp/healthz
            port: 8100
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: smrp-gofiber
spec:
  type: NodePort
  selector:
    app: smrp-gofiber
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8100
      nodePort: 30082
